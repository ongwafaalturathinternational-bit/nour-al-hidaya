name: Cloudflare staging preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/fix/lot8-club-onboarding-and-access'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifier les paramètres Cloudflare de staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Secret CLOUDFLARE_API_TOKEN manquant dans l'environnement staging." && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Secret CLOUDFLARE_ACCOUNT_ID manquant dans l'environnement staging." && exit 1)

      - name: Construire les ressources web avec Firebase staging
        env:
          WAT_FIREBASE_ENV: staging
        run: |
          npm install --no-audit --no-fund
          npm run build:android:web

      - name: Vérifier le routage Firebase avant publication
        run: |
          node --check web-dist/firebase-init.js
          test "$(head -n 1 web-dist/firebase-init.js)" = 'window.WAT_FIREBASE_ENV = "staging";'

      - name: Publier uniquement le Worker de staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.staging.json
