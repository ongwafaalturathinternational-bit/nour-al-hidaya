name: Extraction de revue du plan SYCEBNL

on:
  pull_request:
    paths:
      - "scripts/extract-sycebnl-chart.mjs"
      - ".github/workflows/sycebnl-chart-extraction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-review-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Extraire les neuf classes SYCEBNL
        run: node scripts/extract-sycebnl-chart.mjs

      - name: Publier le fichier de revue
        uses: actions/upload-artifact@v4
        with:
          name: sycebnl-chart-review
          path: data/sycebnl-chart.review.json
          if-no-files-found: error
          retention-days: 14
