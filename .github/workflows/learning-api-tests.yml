name: NH-1 learning API tests

on:
  push:
    branches:
      - feature/nour-central-management-foundation
  pull_request:
    branches:
      - fix/lot8-club-onboarding-and-access
      - feature/nour-central-management-foundation
      - "codex/nour-*"
    paths:
      - "workers/learning-api/**"
      - "tests/learning-api-*.test.js"
      - "package.json"
      - ".github/workflows/learning-api-tests.yml"

permissions:
  contents: read

jobs:
  learning-api:
    name: Worker, OAuth, Firestore and staff authorization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check workers/learning-api/src/index.js
          node --check workers/learning-api/src/config.js
          node --check workers/learning-api/src/google-auth.js
          node --check workers/learning-api/src/firestore-rest.js
          node --check workers/learning-api/src/staff-auth.js
          node --check workers/learning-api/src/turnstile.js
          node --check workers/learning-api/src/assignment-policy.js
          node --check workers/learning-api/src/learning-authorization.js
          node --check workers/learning-api/src/learning-assignment-service.js
          node --check workers/learning-api/src/learning-audit.js
          node --check workers/learning-api/src/learning-schema.js
          node --check workers/learning-api/src/learning-resource-resolver.js
          node --check workers/learning-api/src/registration-request.js
          node --check workers/learning-api/src/registration-idempotency.js
          node --check workers/learning-api/src/registration-service.js
      - name: Run NH-1 tests
        run: npm run test:learning-api

      - name: Check the isolated Worker bundle
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.165.0 deploy --dry-run --config workers/learning-api/wrangler.jsonc --outdir "$RUNNER_TEMP/nh1-worker"

      - name: Smoke-test the compiled Worker without remote services
        run: |
          cp "$RUNNER_TEMP/nh1-worker/index.js" "$RUNNER_TEMP/nh1-worker/index.mjs"
          node --input-type=module - "$RUNNER_TEMP/nh1-worker/index.mjs" <<'NODE'
          import assert from "node:assert/strict";
          import { pathToFileURL } from "node:url";

          const { default: worker } = await import(pathToFileURL(process.argv[2]).href);
          const env = {
            WAT_ENV: "staging",
            FIREBASE_PROJECT_ID: "wat-connect-staging",
            WAT_ENABLE_AGENT_REGISTRATION: "false",
          };
          globalThis.fetch = () => assert.fail("Closed Worker attempted an upstream request");
          const base = "https://worker.invalid";
          const health = await worker.fetch(new Request(base + "/health"), env);
          assert.equal(health.status, 200);
          assert.equal((await health.json()).status, "not-configured");
          const agent = await worker.fetch(new Request(base + "/api/learning/registrations/agent", {
            method: "POST",
          }), env);
          assert.equal(agent.status, 503);
          assert.equal((await agent.json()).error, "service_not_configured");
          NODE
