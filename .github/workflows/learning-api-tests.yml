name: NH-1 learning API tests

on:
  push:
    branches:
      - feature/nour-central-management-foundation
  pull_request:
    branches:
      - fix/lot8-club-onboarding-and-access
      - feature/nour-central-management-foundation
      - "codex/nour-*"
    paths:
      - "workers/learning-api/**"
      - "tests/learning-api-*.test.js"
      - "package.json"
      - ".github/workflows/learning-api-tests.yml"

permissions:
  contents: read

jobs:
  learning-api:
    name: Worker, OAuth, Firestore and staff authorization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check workers/learning-api/src/index.js
          node --check workers/learning-api/src/config.js
          node --check workers/learning-api/src/google-auth.js
          node --check workers/learning-api/src/firestore-rest.js
          node --check workers/learning-api/src/staff-auth.js
          node --check workers/learning-api/src/turnstile.js
          node --check workers/learning-api/src/assignment-policy.js
          node --check workers/learning-api/src/learning-authorization.js
          node --check workers/learning-api/src/learning-assignment-service.js
          node --check workers/learning-api/src/learning-audit.js
          node --check workers/learning-api/src/learning-schema.js
          node --check workers/learning-api/src/learning-resource-resolver.js
          node --check workers/learning-api/src/registration-request.js
      - name: Run NH-1 tests
        run: npm run test:learning-api
