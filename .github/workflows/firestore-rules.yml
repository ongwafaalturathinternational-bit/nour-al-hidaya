name: Firestore security rules

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "administration.html"
      - "programmes.html"
      - "activites.html"
      - "projets.html"
      - "club-khuddam.html"
      - "finance.html"
      - "wat-brand.css"
      - "tests/finance-syntax.test.mjs"
      - "tests/finance-table-a11y.test.mjs"
      - "accounting-engine.mjs"
      - "accounting-lettering.mjs"
      - "finance-access-policy.mjs"
      - "donor-funding.mjs"
      - "scripts/extract-sycebnl-chart.mjs"
      - "tests/accounting-engine.test.mjs"
      - "tests/accounting-lettering.test.mjs"
      - "tests/finance-access-policy.test.mjs"
      - "tests/donor-funding.test.mjs"
      - "tests/finance.rules.test.mjs"
      - "tests/finance-syntax.test.mjs"
      - "tests/projects-volunteers.rules.test.mjs"
      - "tests/projects-volunteers-syntax.test.mjs"
      - "tests/volunteer-applications.rules.test.mjs"
      - "club-khuddam-inscription.html"
      - "tests/activities.rules.test.mjs"
      - "tests/activities-syntax.test.mjs"
      - "tests/programs.rules.test.mjs"
      - "tests/programs-syntax.test.mjs"
      - "tests/members.rules.test.mjs"
      - "tests/admin-syntax.test.mjs"
      - "tests/firestore.rules.test.mjs"
      - ".github/workflows/firestore-rules.yml"
      - "firebase.json"
      - "wrangler.json"
      - ".assetsignore"
      - "tests/cloudflare-preview.test.mjs"
      - "sw.js"
      - "firebase-init.js"
      - "tests/pwa-shell.test.mjs"
      - "index.html"
      - "nour-al-hidaya.html"
      - "manifest.json"
      - "manifest-nour.json"
      - "tests/portal-syntax.test.mjs"
      - "tests/portal-routing.test.mjs"
      - "tests/app-syntax.test.mjs"

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer les outils de test
        run: npm install --no-save firebase-tools firebase @firebase/rules-unit-testing

      - name: Vérifier la syntaxe de l’extracteur SYCEBNL
        run: node --check scripts/extract-sycebnl-chart.mjs

      - name: Extraire le plan SYCEBNL pour revue
        id: sycebnl_extract
        continue-on-error: true
        run: node scripts/extract-sycebnl-chart.mjs

      - name: Publier le brouillon SYCEBNL
        if: steps.sycebnl_extract.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sycebnl-chart-review
          path: data/sycebnl-chart.review.json
          if-no-files-found: error
          retention-days: 14

      - name: Compiler et tester les règles Firestore
        run: npx firebase emulators:exec --only firestore --project demo-wat-connect "node --test tests/*.test.mjs"
