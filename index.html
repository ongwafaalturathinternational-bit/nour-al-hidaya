<title>Nour Al-Hidaya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0F2240">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap">
<style>
/* Concept : une application de cours sobre, marine et or comme les livrets de l'ONG, pensée pour un petit téléphone Android. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#14203A; --muted:#5A667B; --line:#DCE1EB;
  --navy:#0F2240; --navy-ink:#FFFFFF; --gold:#C9972B; --gold-soft:#FBF2DA; --gold-ink:#6B4A07;
  --ok:#1E7A4C; --ok-soft:#E3F3EA; --warn:#A35F00; --warn-soft:#FFF0D6; --bad:#B3372E; --bad-soft:#FBE6E4;
  --blue-soft:#E7EEF9; --fs:1;
  --serif:Georgia,"Times New Roman",serif; --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --arab:"Amiri","Noto Naskh Arabic",Tahoma,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1220; --surface:#121E36; --ink:#E9EDF6; --muted:#98A5BC; --line:#253352;
  --navy:#0F2240; --gold:#D8A93A; --gold-soft:#2A2411; --gold-ink:#EBCB7C;
  --ok:#52C28B; --ok-soft:#10301F; --warn:#E2A24A; --warn-soft:#33260E; --bad:#F0817A; --bad-soft:#3A1816; --blue-soft:#16264A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#121E36; --ink:#E9EDF6; --muted:#98A5BC; --line:#253352;
  --navy:#0F2240; --gold:#D8A93A; --gold-soft:#2A2411; --gold-ink:#EBCB7C;
  --ok:#52C28B; --ok-soft:#10301F; --warn:#E2A24A; --warn-soft:#33260E; --bad:#F0817A; --bad-soft:#3A1816; --blue-soft:#16264A; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:calc(16px*var(--fs))/1.5 var(--sans);padding-inline:max(0px,env(safe-area-inset-left,0px)) max(0px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--serif);margin:0;text-wrap:balance;line-height:1.25}
.ar{font-family:var(--arab);direction:rtl;unicode-bidi:isolate}
header.top{background:var(--navy);color:var(--navy-ink);padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:3px solid var(--gold)}
header.top img{width:34px;height:34px;border-radius:50%;background:#fff}
header.top .t{flex:1;min-width:0}
header.top .t b{font-family:var(--serif);font-size:1.02rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .t small{opacity:.8;font-size:.78rem}
.pill{font-size:.72rem;padding:3px 9px;border-radius:99px;border:1px solid rgba(255,255,255,.35);white-space:nowrap}
.pill.off{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.back{background:none;border:0;color:#fff;font-size:1.4rem;line-height:1;padding:4px 8px 4px 0}
main{flex:1;padding:16px max(16px,env(safe-area-inset-left,0px)) 96px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
nav.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav.bar button{flex:1;background:none;border:0;padding:6px 2px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;border-radius:10px}
nav.bar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bar button.on{color:var(--navy);font-weight:700}
@media (prefers-color-scheme:dark){nav.bar button.on{color:var(--gold)}}
:root[data-theme="dark"] nav.bar button.on{color:var(--gold)}
nav.bar button.on svg{stroke:var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card.plain{border:0;padding:0;background:none}
.lbl{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-size:1.25rem}h3{font-size:1.05rem}
.muted{color:var(--muted)}.small{font-size:.86rem}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.btn{background:var(--navy);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:600;min-height:46px}
.btn.gold{background:var(--gold);color:#1B1403}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:.88rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.bar-p{height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.bar-p i{display:block;height:100%;background:var(--gold);border-radius:9px}
.bar-p.ok i{background:var(--ok)}
.tag{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:99px;font-weight:600;background:var(--blue-soft);color:var(--ink)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.gold{background:var(--gold-soft);color:var(--gold-ink)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;width:100%;text-align:left}
.item.lock{opacity:.6}
.num{width:34px;height:34px;border-radius:50%;background:var(--blue-soft);display:grid;place-items:center;font-weight:700;font-family:var(--serif);flex:none}
.num.done{background:var(--ok);color:#fff}
.hero{background:var(--navy);color:#fff;border-radius:16px;padding:18px;border:1px solid var(--gold)}
.hero h2{color:#fff}.hero .ar{font-size:1.5rem;color:#EBCB7C}
.hero .bar-p{background:rgba(255,255,255,.2);margin-top:12px}
.steps{display:flex;gap:6px}.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}.steps i.on{background:var(--gold)}.steps i.cur{background:var(--navy)}
@media (prefers-color-scheme:dark){.steps i.cur{background:#fff}}
:root[data-theme="dark"] .steps i.cur{background:#fff}
.key{background:var(--gold-soft);border-inline-start:5px solid var(--gold);padding:16px;border-radius:12px;font-family:var(--serif);font-size:1.12rem;color:var(--ink)}
.prose{font-family:var(--serif);font-size:1.02rem;line-height:1.65}
.prose h3{margin:14px 0 4px}.prose p{margin:0 0 10px}
.verse{background:var(--navy);color:#fff;border-radius:14px;padding:18px;text-align:center}
.verse .ar{font-size:1.75rem;line-height:2.1;color:#fff}
.verse .fr{font-family:var(--serif);font-style:italic;opacity:.92}
.verse .ref{color:#EBCB7C;font-size:.85rem;margin-top:4px}
.audio{display:inline-flex;align-items:center;gap:8px;margin-top:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:99px;padding:8px 16px}
textarea,input[type=text],select{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
textarea{min-height:96px;resize:vertical}
label.chk{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
label.chk input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--navy);flex:none}
label.chk.on{border-color:var(--ok);background:var(--ok-soft)}
.opt{display:block;width:100%;text-align:start;padding:13px 14px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;margin-bottom:8px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{padding:12px;border-radius:12px;margin:6px 0 10px}.fb.ok{background:var(--ok-soft)}.fb.no{background:var(--bad-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--navy);background:var(--surface);border-radius:99px;padding:8px 14px}
.chip[disabled]{opacity:.35}
.seq{counter-reset:s;display:flex;flex-direction:column;gap:6px;min-height:46px;margin-bottom:10px}
.seq div{counter-increment:s;background:var(--blue-soft);padding:8px 12px;border-radius:10px}
.seq div::before{content:counter(s) ". ";font-weight:700}
.sel-row{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:12px}
.tri{display:flex;gap:6px}.tri button{flex:1;padding:8px 4px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:.85rem}
.tri button.p.on{background:var(--ok);color:#fff;border-color:var(--ok)}.tri button.a.on{background:var(--bad);color:#fff;border-color:var(--bad)}.tri button.e.on{background:var(--warn);color:#fff;border-color:var(--warn)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{font-family:var(--serif);font-size:1.7rem;display:block;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .r{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:.86rem}
.bars .r div{height:14px;background:var(--line);border-radius:6px;overflow:hidden}.bars .r div i{display:block;height:100%;background:var(--navy)}
@media (prefers-color-scheme:dark){.bars .r div i{background:var(--gold)}}
:root[data-theme="dark"] .bars .r div i{background:var(--gold)}
.note{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:.86rem;border:1px dashed var(--warn)}
.note.info{background:var(--blue-soft);border-color:var(--navy)}
.note.priv{background:var(--bad-soft);border-color:var(--bad)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:99px;z-index:20;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90%;text-align:center;border:1px solid var(--gold)}
.login{padding:28px max(20px,env(safe-area-inset-left,0px)) 30px;display:flex;flex-direction:column;gap:14px;flex:1}
.login .brand{text-align:center;padding:10px 0 6px}
.login .brand img{width:74px;height:74px;border-radius:50%;background:#fff;border:2px solid var(--gold)}
.login .brand h1{font-size:1.7rem;margin-top:8px;color:var(--ink)}
.login .brand .ar{font-size:1.5rem;color:var(--gold)}
.role{display:flex;gap:12px;align-items:center;text-align:start;width:100%;padding:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px}
.role b{font-family:var(--serif);display:block}
.role .ic{width:42px;height:42px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none;font-family:var(--serif);font-weight:700}
.cert{background:#FFFDF6;color:#14203A;border:3px double #C9972B;border-radius:6px;padding:22px 16px;text-align:center;outline:6px solid #0F2240;outline-offset:-1px;margin:6px}
.cert h2{color:#0F2240;font-size:1.35rem}.cert .nm{font-family:var(--serif);font-size:1.6rem;color:#0F2240;border-bottom:2px solid #C9972B;display:inline-block;padding:2px 14px;margin:8px 0}
.cert .ar{color:#C9972B;font-size:1.5rem}
.cert small{color:#555}
.chk-row{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.hr{height:1px;background:var(--line);margin:4px 0}
.disc header.top{background:#33415C}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.card,.item{transition:border-color .15s}}
[dir=rtl] .flip{transform:scaleX(-1);display:inline-block}
[dir=rtl] .bars .r b{text-align:start}
.langs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.langs button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:.88rem}
.langs button.on{background:var(--navy);color:#fff;border-color:var(--gold)}
.free{text-align:center;font-size:.9rem;color:var(--ink);background:var(--gold-soft);border-radius:12px;padding:10px 12px}
</style>

const LESSONS={
1:{mod:1,title:"Qui est Dieu ?",ar:"مَنْ هُوَ اللَّهُ؟",key:"Dieu est le Créateur unique : il nous a créés, il nous connaît et il est proche de nous.",
 text:[["Le Créateur de tout","Regardez autour de vous : le ciel, la pluie, la terre, votre propre corps. Rien de tout cela ne s’est fait tout seul. L’islam enseigne que tout a été créé par un Dieu unique. En arabe, on l’appelle Allah : ce n’est pas le dieu d’un seul peuple, c’est simplement le mot arabe pour dire « Dieu », le Créateur de tous les êtres humains."],
  ["Un Dieu qui connaît et qui est proche","Dieu n’est pas lointain. Il voit, il entend, il connaît nos peines et nos joies. Il est Ar-Rahman, le Miséricordieux, et Ar-Rahim, le Très-Miséricordieux. Il pardonne à celui qui revient vers lui. On peut lui parler à tout moment, avec ses propres mots."],
  ["Ses plus beaux noms","Ses plus beaux noms nous le font connaître : Al-Ghafour (Celui qui pardonne), Al-Hakim (le Sage), Al-‘Adl (le Juste)."]],
 verse:{ar:"وَهُوَ مَعَكُمْ أَيْنَ مَا كُنتُمْ",fr:"« Il est avec vous où que vous soyez »",ref:"Sourate Al-Hadid (57:4)"},
 reflect:["Quand ai-je déjà senti que Dieu était proche, ou que j’avais besoin de lui ?","Quels bienfaits (santé, famille, nourriture…) ai-je reçus cette semaine ?"],
 practice:["Avant de manger ou de commencer un travail, dites « Bismillah » (Au nom d’Allah). Après avoir mangé, dites « Alhamdulillah » (Louange à Allah).","Chaque soir, dites à voix haute, ou notez, trois bienfaits reçus dans la journée.","Répétez avec votre parrain ou votre marraine les deux noms Ar-Rahman et Ar-Rahim."],
 retain:["Dieu est unique et il a tout créé.","Allah est le mot arabe qui veut dire « Dieu ».","Dieu est proche, miséricordieux, et il pardonne."],
 quiz:[
  {t:"qcm",q:"Que veut dire le mot « Allah » ?",o:["C’est le nom d’un prophète","C’est le mot arabe qui veut dire « Dieu »","C’est le nom d’un livre"],a:1,why:"Allah est le mot arabe pour dire « Dieu », le Créateur de tous les êtres humains."},
  {t:"match",q:"Associez chaque nom de Dieu à son sens.",p:[["Ar-Rahman","Le Miséricordieux"],["Al-Ghafour","Celui qui pardonne"],["Al-Hakim","Le Sage"]]},
  {t:"qcm",q:"Que dit-on avant de manger ?",o:["Bismillah","Alhamdulillah","Subhana Llah"],a:0,why:"On dit « Bismillah » avant de manger, et « Alhamdulillah » après."}]},
2:{mod:1,title:"Le Tawhid",ar:"التَّوْحِيدُ",key:"Je m’adresse à Dieu seul, directement, et je lui confie mes épreuves.",
 text:[["Croire en un Dieu unique","Tawhid vient d’un mot arabe qui veut dire « rendre un ». C’est croire qu’Allah est Un : lui seul est le Créateur, lui seul mérite d’être adoré, et lui seul peut guérir, protéger et donner. C’est le cœur de l’islam."],
  ["Pas d’intermédiaire","Pour parler à Dieu, il n’y a besoin ni d’intermédiaire, ni d’objet, ni de rite spécial. Chacun peut l’appeler à tout moment, dans sa propre langue."],
  ["Quand arrive l’épreuve","Maladie, manque d’argent, dispute, peur : tout le monde traverse des épreuves. L’islam invite à se tourner d’abord vers Dieu, tout en faisant ce qu’on peut : se soigner, consulter un médecin, travailler, demander conseil. On agit, puis on s’en remet à Dieu : c’est la confiance (tawakkul). L’islam l’explique avec douceur : on apprend pas à pas, sans honte et sans jugement."]],
 verse:{ar:"إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ",fr:"« C’est Toi seul que nous adorons, et c’est Toi seul dont nous implorons le secours »",ref:"Sourate Al-Fatiha (1:5)"},
 reflect:["Vers qui est-ce que je me tourne en premier quand j’ai peur ou quand je suis malade ?","Qu’est-ce que cela changerait de savoir que Dieu m’entend, sans intermédiaire ?"],
 practice:["Parlez à Dieu pendant deux minutes, avec vos mots et dans votre langue (c’est la du‘a) : remerciez-le, puis dites-lui ce qui vous pèse.","Avec votre parrain ou votre marraine, listez trois difficultés que vous avez vécues. Pour chacune : qu’avez-vous fait ? Que pourriez-vous faire, puis confier à Dieu ?","Apprenez cette phrase : « Tawakkaltu ‘ala Allah » (j’ai placé ma confiance en Allah)."],
 retain:["Le Tawhid, c’est croire qu’Allah est Un.","On s’adresse à Dieu seul, sans intermédiaire.","Face à l’épreuve : on agit, puis on met sa confiance en Dieu."],
 quiz:[
  {t:"qcm",q:"Que veut dire « Tawhid » ?",o:["Croire qu’Allah est Un","Faire un pèlerinage","Donner la zakat"],a:0,why:"Tawhid vient d’un mot qui veut dire « rendre un » : croire qu’Allah est Un."},
  {t:"qcm",q:"Pour parler à Dieu, faut-il un intermédiaire ?",o:["Oui, une personne spéciale","Oui, un objet ou un rite","Non : on peut l’appeler à tout moment, dans sa langue"],a:2,why:"Il n’y a besoin ni d’intermédiaire, ni d’objet, ni de rite spécial."},
  {t:"qcm",q:"Face à une épreuve, que fait-on ?",o:["On agit (se soigner, travailler, demander conseil), puis on met sa confiance en Dieu","On attend sans rien faire","On ne compte que sur des objets"],a:0,why:"On agit, puis on s’en remet à Dieu : c’est la confiance (tawakkul)."}]},
7:{mod:2,title:"La purification (wudu)",ar:"الطَّهَارَةُ",key:"Je me purifie avant la prière : un corps propre et un cœur présent.",
 text:[["Pourquoi se purifier ?","La prière est un rendez-vous avec Dieu : on s’y prépare, comme avant de rencontrer quelqu’un d’important. « La propreté est la moitié de la foi » (Muslim)."],
  ["Le wudu, pas à pas","1. Avoir l’intention et dire Bismillah\n2. Se laver les mains (3 fois)\n3. Se rincer la bouche, puis le nez (3 fois)\n4. Se laver le visage (3 fois)\n5. Se laver les bras jusqu’aux coudes (3 fois)\n6. Passer la main mouillée sur la tête et les oreilles\n7. Se laver les pieds jusqu’aux chevilles (3 fois)"],
  ["Ce qui annule le wudu","Aller aux toilettes (urine, selles, gaz), un sommeil profond, une perte de connaissance. On refait alors le wudu."],
  ["Pour aller plus loin","Après des relations conjugales ou à la fin des règles, on fait un bain complet (ghusl). Sans eau, on peut faire le tayammum avec de la terre propre (Coran 5:6). Votre parrain ou votre marraine vous l’explique avec discrétion."]],
 verse:{ar:"إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ",fr:"« Allah aime ceux qui se repentent et ceux qui se purifient »",ref:"Sourate Al-Baqara (2:222)"},
 reflect:["Qu’est-ce que la propreté change dans mon état d’esprit avant de rencontrer quelqu’un d’important ?"],
 practice:["Faites le wudu avec votre parrain ou votre marraine : il ou elle le fait d’abord, puis vous, en disant les étapes à voix haute.","Le lendemain, refaites-le seul(e), sans regarder la page.","Au début, dites Bismillah. À la fin, vous pouvez dire la Shahada (rapporté par Muslim)."],
 retain:["Le wudu se fait en sept étapes, avec de l’eau propre.","Les besoins naturels, le sommeil profond et la perte de connaissance l’annulent.","Après certaines situations, on fait le ghusl ; sans eau, le tayammum."],
 quiz:[

function lessonView(){
 const{id,step}=R.lesson,L=LESSONS[id];
 const bar=`<div class="steps">${STEPS.map((_,i)=>`<i class="${i<step?"on":i===step?"cur":""}"></i>`).join("")}</div><div class="row small muted"><span>${STEPS[step]}</span><span class="sp"></span><span>${step+1} / ${STEPS.length}</span></div>`;
 let b="";
 if(step===0)b=`<div class="lbl">Leçon ${id}</div><h2 style="margin:2px 0 4px">${esc(L.title)}</h2><div class="ar" style="font-size:1.5rem;color:var(--gold)">${L.ar}</div><div class="key" style="margin-top:14px">${esc(L.key)}</div>`;
 if(step===1)b=`<div class="prose">${L.text.map(([h,p])=>`<h3>${esc(h)}</h3>${p.split("\n").map(x=>`<p style="margin-bottom:${p.includes("\n")?4:10}px">${esc(x)}</p>`).join("")}`).join("")}</div>`;

 if(step===3){const v=S.reflect["u1:"+id]||"";b=`<div class="card" style="background:var(--gold-soft)"><div class="lbl">Pause réflexion</div>${L.reflect.map(q=>`<p class="prose" style="margin:8px 0 0">${esc(q)}</p>`).join("")}</div><label class="lbl" for="refl">Mes notes (visibles de moi seul)</label><textarea id="refl" data-a="refl" placeholder="Facultatif">${esc(v)}</textarea>`}
 if(step===4){const c=S.practice["u1:"+id]||[];b=`<div class="lbl">Cette semaine, je fais…</div>${L.practice.map((p,i)=>`<label class="chk prac ${c.includes(i)?"on":""}"><input type="checkbox" data-a="prac" data-v="${i}" ${c.includes(i)?"checked":""}><span>${esc(p)}</span></label>`).join("")}<div class="small muted">Votre parrain ou votre marraine verra ce que vous avez coché.</div>`}

 if(step===6)b=quizView();
 const q=R.lesson.q,last=step===6;
 const nav=!last?`<div class="row"><button class="btn ghost" data-a="prev" ${step===0?"disabled":""}>Précédent</button><span class="sp"></span><button class="btn" data-a="next">Suivant</button></div>`:(q.fin?"":`<div class="row"><button class="btn ghost" data-a="prev">Précédent</button></div>`);

function quizView(){
 const{id,q}=R.lesson,L=LESSONS[id],n=L.quiz.length;
 if(q.fin){const stars=q.score===n?"Parfait !":q.score>=n/2?"Bien joué !":"Continuez, vous y arrivez.";
  return `<div class="card" style="text-align:center"><div class="lbl">Leçon terminée</div><h2 style="margin:6px 0">${q.score} / ${n}</h2><p style="margin:0 0 12px">${stars}</p><button class="btn gold full" data-a="finish">Retour au parcours</button></div>`}
 const Q=L.quiz[q.i];let h=`<div class="lbl">Question ${q.i+1} sur ${n}</div><h3 style="margin:2px 0 12px">${esc(Q.q)}</h3>`;
 if(Q.t==="qcm"){h+=Q.o.map((o,i)=>{let c="opt";if(q.fb){if(i===Q.a)c+=" right";else if(i===q.fb.pick)c+=" wrong"}return `<button class="${c}" data-a="pick" data-v="${i}" ${q.fb?"disabled":""}>${esc(o)}</button>`}).join("");
  if(q.fb)h+=`<div class="fb ${q.fb.ok?"ok":"no"}"><b>${q.fb.ok?"Oui !":"Pas tout à fait."}</b> ${esc(Q.why)}</div>`}
 if(Q.t==="order"){const rest=Q.items.map((t,i)=>i).filter(i=>!q.seq.includes(i));const shuffled=q.shuf||(q.shuf=[...Q.items.keys()].sort((a,b)=>((a*5+3)%7)-((b*5+3)%7)));
  h+=`<div class="seq">${q.seq.map(i=>`<div>${esc(Q.items[i])}</div>`).join("")}</div><div class="chips">${shuffled.map(i=>`<button class="chip" data-a="seq" data-v="${i}" ${q.seq.includes(i)||q.fb?"disabled":""}>${esc(Q.items[i])}</button>`).join("")}</div>`;
  if(!q.fb)h+=`<div class="row" style="margin-top:12px"><button class="btn ghost sm" data-a="seqclr">Effacer</button><span class="sp"></span><button class="btn sm" data-a="seqok" ${q.seq.length<Q.items.length?"disabled":""}>Valider</button></div>`;
  else h+=`<div class="fb ${q.fb.ok?"ok":"no"}"><b>${q.fb.ok?"L’ordre est bon !":"Pas tout à fait."}</b> ${q.fb.ok?"":"L’ordre correct : "+Q.items.map((t,i)=>(i+1)+". "+t).join(" ")}</div>`}
 if(Q.t==="match"){const opts=q.mo||(q.mo=Q.p.map(p=>p[1]).sort());
  h+=Q.p.map((p,i)=>`<div class="sel-row"><b>${esc(p[0])}</b><select id="m${i}" ${q.fb?"disabled":""}><option value="">Choisir…</option>${opts.map(o=>`<option ${q.sel[i]===o?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`).join("");
  if(!q.fb)h+=`<button class="btn full" data-a="matchok">Valider</button>`;
  else h+=`<div class="fb ${q.fb.ok?"ok":"no"}"><b>${q.fb.ok?"Tout est juste !":"Pas tout à fait."}</b> ${Q.p.map(p=>esc(p[0])+" : "+esc(p[1])).join(" · ")}</div>`}
 if(q.fb)h+=`<button class="btn full" data-a="qnext">${q.i+1<n?"Question suivante":"Terminer"}</button>`;
 return h}

function vChiffres(){
 const R0=reg(),n=R0.length,cnt=f=>R0.filter(f).length,wait=S.learners.filter(l=>l.st==="attente").length;
 const as=R0.map(l=>assid(l.id)).filter(x=>x!==null),asm=Math.round(as.reduce((a,b)=>a+b,0)/as.length);
 const comp=Math.round(100*R0.reduce((a,l)=>a+lessonsDone(l.id),0)/(n*AVAIL.length));
 const sat=(S.sat.reduce((a,b)=>a+b,0)/S.sat.length).toFixed(1);
 const bars=(arr)=>`<div class="bars">${arr.map(([k,v])=>`<div class="r"><span>${k}</span><div><i style="width:${n?Math.round(100*v/n):0}%"></i></div><b>${v}</b></div>`).join("")}</div>`;
 const csv="Nom;Sexe;Âge;Pays;Mosquée;Niveau;Présence %;Leçons;Validé\n"+R0.map(l=>[l.name,l.sex,l.age,l.cc,mosqName(l.mosq),l.level,assid(l.id),lessonsDone(l.id),S.val[l.id]?"oui":"non"].join(";")).join("\n");
 R.csv=csv;
 return `<div><div class="lbl">Programme Nour Al-Hidaya</div><h2>Tableau de bord</h2></div>
 <div class="kpis"><div class="kpi"><span class="lbl">Inscrits</span><b>${n}</b><span class="small muted">${new Set(R0.map(l=>l.cc)).size} pays</span></div><div class="kpi"><span class="lbl">Présence moy.</span><b>${asm} %</b><span class="small muted">cible ≥ 70 %</span></div><div class="kpi"><span class="lbl">Leçons faites</span><b>${comp} %</b></div><div class="kpi"><span class="lbl">Attestations</span><b>${Object.keys(S.val).length}</b></div></div>
 <div class="card"><h3>Par niveau</h3><div style="margin-top:10px">${bars([["Niveau 1",cnt(l=>l.level===1)],["Niveau 2",cnt(l=>l.level===2)],["Niveau 3",0]])}</div></div>
 <div class="card"><h3>Femmes et hommes</h3><div style="margin-top:10px">${bars([["Femmes",cnt(l=>l.sex==="F")],["Hommes",cnt(l=>l.sex==="M")]])}</div></div>
 ${wait?`<div class="note info"><b>${wait} demande${wait>1?"s":""} d’inscription</b> en attente de confirmation par les agents de mosquée.</div>`:""}
 <div class="card"><h3>Par mosquée</h3><div style="margin:10px 0 0">${bars([...MOSQ.map(m=>[m[1].split(" ·")[0],cnt(l=>l.mosq===m[0])]),["En ligne",cnt(l=>!l.mosq)]])}</div></div>
 <div class="card"><h3>Par pays</h3><div style="margin:10px 0 0">${bars([...new Set(R0.map(l=>l.cc))].map(c=>[country(c),cnt(l=>l.cc===c)]))}</div></div>
 <div class="card"><h3>Par âge</h3><div style="margin-top:10px">${bars(AGES.map(a=>[a[1].replace(" ans",""),cnt(l=>l.age===a[0])]))}</div></div>
 <div class="card"><div class="row"><h3 class="sp">Satisfaction</h3><b style="font-family:var(--serif);font-size:1.4rem">${Math.round(sat*20)} %</b></div><div class="small muted">${S.sat.length} avis · cible ≥ 75 %</div></div>
 <button class="btn ghost full" data-a="csv">Copier la liste (tableur)</button>
 <div class="note">Ces chiffres correspondent aux indicateurs du plan stratégique : inscrits par niveau, sexe et âge, assiduité, complétion, niveaux validés, satisfaction. La version finale les exporte en Excel et PDF, sans noms.</div>`}
function vProtection(){
 return `<div><div class="lbl">Point focal protection</div><h2>Signalements</h2></div>
 <div class="note priv">Accès réservé au point focal. Le registre ne montre que des codes. Aucune suppression possible.</div>
 <div class="list">${S.reports.map(r=>`<div class="card"><div class="row"><b class="sp">${r.code}</b><span class="tag ${r.urgent?"bad":"gold"}">${esc(r.status)}</span></div><div class="small muted">${fmt(r.date)} · ${esc(r.type)}</div>${R.open===r.code?`<p style="margin:8px 0 0">${esc(r.facts)}</p>`:`<button class="btn ghost sm" style="margin-top:8px" data-a="openrep" data-v="${r.code}">Ouvrir la fiche (point focal)</button>`}</div>`).join("")}</div>
 <button class="btn gold full" data-a="report">Faire un signalement</button>`}
function reportForm(){return `<div class="note info">Ce formulaire reprend la fiche de signalement de l’ONG. En cas de danger immédiat, appelez d’abord les secours ou les autorités de votre pays.</div>
 <div><label class="lbl" for="rt">De quoi s’agit-il ?</label><select id="rt"><option>Inquiétude sur le comportement d’un adulte</option><option>Enfant ou personne en danger</option><option>Pression ou rejet vécu par un converti</option><option>Autre inquiétude</option></select></div>
 <div><label class="lbl" for="rf">Ce que j’ai vu ou entendu (faits, sans interpréter)</label><textarea id="rf"></textarea></div>
 <label class="chk"><input type="checkbox" id="ru"><span>Il y a un danger immédiat</span></label>
 <button class="btn full" data-a="sendrep">Envoyer au point focal</button><p class="small muted">Envoyé même sans connexion. Ne promettez jamais le secret absolu à la personne concernée.</p>`}
function vMoi(){
 return `<h2>Moi</h2>
 <div class="card"><h3>Taille du texte</h3><div class="row" style="margin-top:10px"><button class="btn ghost sm sp" data-a="fs" data-v="-0.1">A−</button><b class="sp" style="text-align:center">${Math.round(S.set.fs*100)} %</b><button class="btn ghost sm sp" data-a="fs" data-v="0.1">A+</button></div></div>
 <label class="chk ${S.set.discreet?"on":""}"><input type="checkbox" data-a="disc" ${S.set.discreet?"checked":""}><span><b>Mode discret</b><br><span class="small muted">Le nom de l’application devient « Mon cours » et les notifications n’affichent aucun mot religieux. Utile si l’entourage n’est pas informé.</span></span></label>
 <button class="btn ghost full" data-a="report">Signaler une inquiétude</button>
 <div class="card"><h3>Langue</h3><div style="margin:10px 0 8px">${langBar()}</div><p class="small muted" style="margin:0">Dans ce prototype, les menus sont en français, anglais et arabe ; les leçons sont en français. Les leçons en anglais, arabe, fon, yoruba, goun et autres langues sont prévues, ajoutées par l’ONG sans nouveau développement.</p></div>
 ${S.role==="apprenant"?`<div class="card"><h3>Mon accompagnement</h3><div class="list" style="margin-top:10px"><div><label class="lbl" for="mo">Je veux apprendre</label><select id="mo" data-a="mode"><option value="seul" ${S.set.mode==="seul"?"selected":""}>Seul(e), à mon rythme</option><option value="groupe" ${S.set.mode==="groupe"?"selected":""}>Avec un groupe en ligne</option><option value="presentiel" ${S.set.mode==="presentiel"?"selected":""}>Avec un groupe près de chez moi</option></select></div><div><label class="lbl" for="mc">Mon pays</label><select id="mc" data-a="cc">${CCS.map(c=>`<option value="${c}" ${learner("u1").cc===c?"selected":""}>${esc(country(c))}</option>`).join("")}<option value="XX">Autre</option></select></div></div></div>`:""}
 <div class="card"><h3>Hors ligne</h3><p class="small muted" style="margin:4px 0 0">${online()?"Vous êtes en ligne.":"Vous êtes hors ligne : vos réponses sont gardées et partiront au retour du réseau."}</p></div>
 <button class="btn ghost full" data-a="logout">Changer de profil</button>
 <button class="btn ghost full" data-a="reset">Remettre les données d’exemple</button>`}
function attestView(){
 const l=learner(R.attest),v=S.val[l.id];
 return `<div class="cert"><small>ONG WAFA AL-TURATH INTERNATIONAL</small><div class="ar">شهادة</div><h2>Attestation de fin de niveau 1</h2><small>Programme Nour Al-Hidaya</small><p style="margin:14px 0 0">décernée à</p><div class="nm">${esc(l.name)}</div><p style="margin:6px 0">pour avoir suivi avec assiduité les leçons du niveau 1 et réussi ses évaluations.</p><small>Délivrée le ${fmt(v.date)} · N° ${v.no}</small><div class="row" style="justify-content:space-around;margin-top:16px"><small>Le Responsable pédagogique</small><small>Le Président</small></div></div>
 <div class="note">Modèle de démonstration. La version finale reprend le modèle officiel de l’ONG, génère le fichier PDF et ajoute un code QR permettant de vérifier l’attestation.</div>`}

/* ---------- actions ---------- */
function finishLessonScore(){const{id,q}=R.lesson;S.done.u1[id]={s:q.score,t:LESSONS[id].quiz.length};save()}
const A={
 login(v){S.role=v;R.tab=null;save()},
 lang(v){S.set.lang=v;save()},
 signupo(){R.signup=true},signupx(){R.signup=false},
 signup(){const n=$("#sn").value.trim();if(!n){toast("Choisissez un prénom ou un pseudonyme");return false}
  const l=learner("u1");l.name=n;l.cc=$("#sc").value;l.sex=$("#sx").value;l.age=$("#sa").value;l.volet=$("#sv").value;l.mosq=$("#sq").value;l.by="direct";S.set.mode=$("#sm").value;l.st=S.set.mode==="seul"?"libre":"attente";S.done.u1={};S.subs=S.subs.filter(x=>x.u!=="u1");
  Object.keys(S.practice).concat(Object.keys(S.reflect)).forEach(k=>{if(k.startsWith("u1:")){delete S.practice[k];delete S.reflect[k]}});S.sessions.forEach(x=>delete x.marks.u1);delete S.val.u1;
  S.role="apprenant";R.signup=false;R.tab=null;save();toast("Bienvenue ! Votre espace est prêt")},
 mode(){S.set.mode=$("#mo").value;const l=learner("u1");if(l.st==="libre"&&S.set.mode!=="seul")l.st="attente";else if(l.st==="attente"&&S.set.mode==="seul")l.st="libre";save()},
 cc(){learner("u1").cc=$("#mc").value;save()},
 logout(){S.role=null;save()},
 tab(v){R.tab=v;R.newhw=false},
 back(){R.lesson=R.hw=R.attest=R.learner=null;R.report=false;R.hwu=null},
 lesson(v){startLesson(+v)},
 hw(v){R.hw=v},
 prev(){R.lesson.step--},
 next(){R.lesson.step++},
 audio(){toast("Audio : fourni par l’ONG dans la version finale")},
 pick(v){const{id,q}=R.lesson,Q=LESSONS[id].quiz[q.i];if(q.fb)return;const ok=+v===Q.a;q.fb={ok,pick:+v};if(ok)q.score++},
 seq(v){R.lesson.q.seq.push(+v)},
 seqclr(){R.lesson.q.seq=[]},
 seqok(){const{id,q}=R.lesson,Q=LESSONS[id].quiz[q.i];const ok=q.seq.every((x,i)=>x===i);q.fb={ok};if(ok)q.score++},
 matchok(){const{id,q}=R.lesson,Q=LESSONS[id].quiz[q.i];let ok=true;Q.p.forEach((p,i)=>{const v=$("#m"+i).value;q.sel[i]=v;if(v!==p[1])ok=false});if(Object.keys(q.sel).length&&Q.p.some((p,i)=>!q.sel[i])){toast("Choisissez une réponse pour chaque nom");return false}q.fb={ok};if(ok)q.score++},
 qnext(){const{id,q}=R.lesson;if(q.i+1<LESSONS[id].quiz.length){q.i++;q.fb=null;q.seq=[];q.sel={};q.shuf=null;q.mo=null}else{q.fin=true;finishLessonScore()}},
 finish(){R.lesson=null;toast("Leçon enregistrée ✓")},
 prac(v,e){const k="u1:"+R.lesson.id;const a=S.practice[k]||(S.practice[k]=[]);const i=+v;if(a.includes(i))a.splice(a.indexOf(i),1);else a.push(i);save()},
 sendtext(){const t=$("#hwt").value.trim();if(!t){toast("Écrivez d’abord votre réponse");return false}submit({text:t})},
 sendfile(){const f=$("#hwf").files[0];if(!f){toast("Choisissez d’abord un fichier");return false}submit({file:f.name})},
 sat(v){S.sat.push(+v);save();toast("Merci pour votre avis")},
 attest(v){R.attest=v},
 learner(v){R.learner=v},
 validate(v){const n=Object.keys(S.val).length+1;S.val[v]={date:dayISO(),no:"NH-N1-"+String(n).padStart(4,"0")};save();toast("Attestation délivrée");},
 mark(v,e){const t=dayISO();let s=S.sessions.find(x=>x.date===t);if(!s){s={date:t,marks:{}};S.sessions.push(s)}s.marks[e.dataset.u]=v;save()},
 newhw(){R.newhw=!R.newhw},
 savehw(){const t=$("#nt").value.trim(),b=$("#nb").value.trim();if(!t||!b){toast("Ajoutez un titre et une consigne");return false}S.hw.push({id:"h"+(S.hw.length+1),title:t,brief:b,type:$("#ny").value,due:$("#nd").value||dayISO(7)});R.newhw=false;save();toast("Devoir envoyé au groupe")},
 corr(v){const[h,u]=v.split("|");R.hw=h;R.hwu=u;R.corr=true},
 rdv(v){const t=$("#rn-"+v).value.trim();if(!t){toast("Écrivez une note");return false}S.rdv.push({u:v,date:dayISO(),note:t});save();toast("Rencontre enregistrée")},
 csv(){const t=R.csv;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Liste copiée, à coller dans un tableur")).catch(()=>toast("Copie impossible ici"))},
 openrep(v){R.open=v},
 report(){R.report=true},
 sendrep(){const f=$("#rf").value.trim();if(!f){toast("Décrivez ce que vous avez vu");return false}const n=S.reports.length+1;S.reports.push({code:"SG-2026-"+String(n).padStart(3,"0"),date:dayISO(),type:$("#rt").value,facts:f,urgent:$("#ru").checked,status:"Nouveau"});R.report=false;save();toast("Transmis au point focal")},
 avolet(){const v=$("#av").value;document.querySelectorAll(".vB").forEach(e=>e.hidden=v!=="B");document.querySelectorAll(".vC").forEach(e=>e.hidden=v!=="C");return false},
 ins(){const n=$("#an").value.trim();if(!n){toast("Écrivez le nom et le prénom");return false}
  if(!$("#ac").checked){toast("L’accord pour l’enregistrement des données est nécessaire");return false}
  if($("#aa").value==="-18"&&!$("#am").checked){toast("L’accord écrit d’un parent est nécessaire pour un mineur");return false}
  const v=$("#av").value,k=S.learners.length+1,pole=$("#apo").value;
  S.learners.push({id:"u"+k+Date.now()%1000,name:n.split(" ")[0],sex:$("#as").value,age:$("#aa").value,level:1,cc:"BJ",mosq:pole,st:"inscrit",by:$("#asp").checked?"papier":"agent",volet:v,code:(v==="B"?"AH":"AC")+"-"+pole.toUpperCase()+"-"+String(k).padStart(4,"0")});save();toast("Inscrit(e) au registre ✓");R.tab="registre"},
 confirm(v){learner(v).st="inscrit";save();toast("Inscription confirmée. L’apprenant en est informé.")},
 mode2(){S.set.mode="groupe";const l=learner("u1");if(l.st==="libre")l.st="attente";save();toast("Demande envoyée")},
 fs(v){S.set.fs=Math.min(1.4,Math.max(.9,Math.round((S.set.fs+ +v)*10)/10));save()},
 disc(){S.set.discreet=!S.set.discreet;save()},
 reset(){S=seed();R={tab:null};save();toast("Données d’exemple rétablies")}
};
function submit(o){const u="u1",h=R.hw;const pend=!online();S.subs=S.subs.filter(s=>!(s.hw===h&&s.u===u));S.subs.push({hw:h,u,date:dayISO(),status:"rendu",pending:pend,...o});save();toast(pend?"Gardé : il partira avec le réseau":"Devoir envoyé ✓")}

/* correction par le formateur */
const origHw=hwDetail;
hwDetail=function(){
 if(S.role!=="formateur"||!R.corr)return origHw();
 const h=S.hw.find(x=>x.id===R.hw),l=learner(R.hwu),s=S.subs.find(x=>x.hw===h.id&&x.u===l.id);
 return `<div class="card"><div class="lbl">${esc(l.name)} · ${esc(h.title)}</div><p style="margin:6px 0 0">${s.text?esc(s.text):"Fichier : "+esc(s.file)}</p></div>
 <div class="card"><h3>Ma correction</h3><div class="list" style="margin-top:8px"><div><label class="lbl" for="cn">Note sur 3</label><select id="cn"><option>3</option><option>2</option><option>1</option><option>0</option></select></div><div><label class="lbl" for="cc">Commentaire</label><textarea id="cc" placeholder="Encouragez, puis précisez un point à améliorer."></textarea></div><button class="btn full" data-a="sendcorr">Envoyer la correction</button></div></div>`};
A.sendcorr=function(){const s=S.subs.find(x=>x.hw===R.hw&&x.u===R.hwu);s.status="corrigé";s.note=+$("#cn").value;s.comment=$("#cc").value.trim()||"Merci pour votre travail.";save();R.hw=null;R.corr=false;toast("Correction envoyée")};
const backOrig=A.back;A.back=function(){R.corr=false;backOrig()};

/* ---------- événements ---------- */
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||t.tagName==="TEXTAREA"||t.tagName==="SELECT")return;if(t.type==="checkbox"&&t.dataset.a==="refl")return;
 const f=A[t.dataset.a];if(!f)return;if(f(t.dataset.v,t)===false)return;render();});
document.addEventListener("change",e=>{const t=e.target;if(t.tagName==="SELECT"&&A[t.dataset.a]){if(A[t.dataset.a]()!==false)render()}});
document.addEventListener("input",e=>{if(e.target.id==="refl"&&R.lesson){S.reflect["u1:"+R.lesson.id]=e.target.value;save()}});
window.addEventListener("online",()=>{S.subs.forEach(s=>s.pending=false);save();render();toast("Connexion revenue : tout est envoyé")});
window.addEventListener("offline",render);
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
